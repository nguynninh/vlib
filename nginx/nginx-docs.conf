# --- Frontend docs (Next.js) ---
server {
    listen 80;
    server_name docs-mobile.vtvlive.vn;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name docs-mobile.vtvlive.vn;

    ssl_certificate     /etc/letsencrypt/live/docs-mobile.vtvlive.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs-mobile.vtvlive.vn/privkey.pem;

    # Bản mới nhất, phục vụ ở gốc "/"
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Deploy API (proxy tới deploy-api service, port 9000) ---
server {
    listen 80;
    server_name api-docs-mobile.vtvlive.vn;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-docs-mobile.vtvlive.vn;

    ssl_certificate     /etc/letsencrypt/live/api-docs-mobile.vtvlive.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-docs-mobile.vtvlive.vn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}